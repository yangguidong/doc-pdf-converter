<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>导出部署文件</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#08080c;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  h1{font-size:1.5rem;margin-bottom:8px;background:linear-gradient(135deg,#34d399,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .card{background:#111118;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:28px;max-width:500px;width:100%;text-align:center}
  button{padding:14px 32px;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
  .btn-go{background:linear-gradient(135deg,#34d399,#059669);color:#fff;width:100%}
  .btn-go:hover{box-shadow:0 4px 24px rgba(52,211,153,.3)}
  .btn-go:disabled{opacity:.5;cursor:not-allowed}
  .log{background:rgba(0,0,0,.3);border-radius:8px;padding:14px;margin-top:16px;max-height:200px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#7a7a8a;text-align:left;display:none}
  .log.show{display:block}
  .log .ok{color:#34d399}
  .log .fail{color:#f43f5e}
  .info{font-size:.7rem;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>📦 一键打包下载</h1>
  <p>所有文件打包成一个 ZIP，只弹一次保存框</p>
  <button class="btn-go" id="btnGo" onclick="doExport()">🚀 打包下载全部媒体文件</button>
  <div class="log" id="log"></div>
  <div class="info" id="info"></div>
</div>

<script>
const DB='PF_DB',S='media';
function odb(){return new Promise((ok,fail)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(S)};r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function dbGet(k){const db=await odb();return new Promise(ok=>{const t=db.transaction(S,'readonly');const r=t.objectStore(S).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}

const logEl=document.getElementById('log'),infoEl=document.getElementById('info'),btnGo=document.getElementById('btnGo');
function log(msg,cls){logEl.classList.add('show');logEl.innerHTML+='<span class="'+cls+'">'+msg+'</span>\n';logEl.scrollTop=logEl.scrollHeight}

// Minizip - create a minimal valid ZIP file
function createZip(files){
  // ZIP format: LocalFileHeaders + FileData + CentralDirectory + EndOfCentralDirectory
  const encoder=new TextEncoder();
  let cd=[]; // Central directory entries
  let cdoffset=0;
  let chunks=[];

  for(const {name,data} of files){
    const nameBytes=encoder.encode(name);
    const crc=crc32(data);
    const compressed=data; // STORE (no compression)
    const header=new Uint8Array(30+nameBytes.length);
    const view=new DataView(header.buffer);
    view.setUint32(0,0x04034b50,true); // Local file header signature
    view.setUint16(4,20,true); // Version needed
    view.setUint16(6,0,true); // Flags
    view.setUint16(8,0,true); // Compression: STORE
    view.setUint16(10,0,true); // Mod time
    view.setUint16(12,0,true); // Mod date
    view.setUint32(14,crc,true); // CRC-32
    view.setUint32(18,data.length,true); // Compressed size
    view.setUint32(22,data.length,true); // Uncompressed size
    view.setUint16(26,nameBytes.length,true); // Filename length
    view.setUint16(28,0,true); // Extra field length
    header.set(nameBytes,30);
    chunks.push(header,new Uint8Array(data));

    // Central directory entry
    const cdEntry=new Uint8Array(46+nameBytes.length);
    const cdView=new DataView(cdEntry.buffer);
    cdView.setUint32(0,0x02014b50,true);
    cdView.setUint16(4,20,true);
    cdView.setUint16(6,20,true);
    cdView.setUint16(8,0,true);
    cdView.setUint16(10,0,true);
    cdView.setUint16(12,0,true);
    cdView.setUint16(14,0,true);
    cdView.setUint32(16,crc,true);
    cdView.setUint32(20,data.length,true);
    cdView.setUint32(24,data.length,true);
    cdView.setUint16(28,nameBytes.length,true);
    cdView.setUint16(30,0,true);
    cdView.setUint16(32,0,true);
    cdView.setUint16(34,0,true);
    cdView.setUint32(36,0,true);
    cdView.setUint32(42,cdoffset,true);
    cdEntry.set(nameBytes,46);
    cd.push(cdEntry);
    cdoffset+=header.length+data.length;
  }

  const cdData=new Uint8Array(cd.reduce((s,e)=>s+e.length,0));
  let cdPos=0;
  for(const e of cd){cdData.set(e,cdPos);cdPos+=e.length}

  // End of central directory
  const eocd=new Uint8Array(22);
  const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(4,0,true);
  ev.setUint16(6,0,true);
  ev.setUint16(8,cd.length,true);
  ev.setUint16(10,cd.length,true);
  ev.setUint32(12,cdData.length,true);
  ev.setUint32(16,cdoffset,true);
  ev.setUint16(20,0,true);

  const total=new Uint8Array(cdoffset+cdData.length+eocd.length);
  let pos=0;
  for(const c of chunks){total.set(c,pos);pos+=c.length}
  total.set(cdData,pos);pos+=cdData.length;
  total.set(eocd,pos);
  return total.buffer;
}

function crc32(data){
  let crc=0xFFFFFFFF;
  const arr=new Uint8Array(data);
  for(let i=0;i<arr.length;i++){
    crc^=arr[i];
    for(let j=0;j<8;j++)crc=(crc>>>1)^(crc&1?0xEDB88320:0);
  }
  return (crc^0xFFFFFFFF)>>>0;
}

async function doExport(){
  btnGo.disabled=true;btnGo.textContent='读取中...';logEl.innerHTML='';
  const raw=localStorage.getItem('pf_data2');if(!raw){alert('没有数据');return}
  const data=JSON.parse(raw);

  const allKeys=[];
  (data.photos||[]).forEach(x=>{(x.imgs&&x.imgs.length?x.imgs:[x.id]).forEach(k=>allKeys.push(k))});
  (data.videos||[]).forEach(x=>{allKeys.push(x.id);if(x.thumbKey)allKeys.push(x.thumbKey)});

  log('共 '+allKeys.length+' 个文件，读取中...','ok');

  const files=[];
  let ok=0,fail=0;
  for(const k of allKeys){
    try{
      const blob=await dbGet(k);
      if(!blob){fail++;log('❌ '+k+' (无数据)','fail');continue}
      const buf=await blob.arrayBuffer();
      const ext=blob.type.split('/')[1]||'bin';
      files.push({name:k+'.'+ext,data:buf});
      ok++;log('✅ '+k+'.'+ext+' ('+(blob.size/1024).toFixed(0)+'KB)','ok');
    }catch(e){fail++;log('❌ '+k,'fail')}
    btnGo.textContent='读取中... '+Math.round((ok+fail)/allKeys.length*100)+'%';
  }

  log('--- 打包 '+ok+' 个文件为 ZIP ---','ok');
  btnGo.textContent='打包中...';
  await new Promise(r=>setTimeout(r,100));

  const zipBuf=createZip(files);
  const blob=new Blob([zipBuf],{type:'application/zip'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='media_files.zip';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);

  log('✅ ZIP 已下载 ('+(zipBuf.byteLength/1024/1024).toFixed(1)+'MB)','ok');
  infoEl.innerHTML='解压 media_files.zip 到 d:\\Python\\uploads\\ 然后运行 sync_media.bat';
  btnGo.disabled=false;btnGo.textContent='🔄 重新打包';
}
</script>
</body>
</html>
