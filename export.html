<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>导出缺失文件</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#08080c;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  h1{font-size:1.5rem;margin-bottom:8px;background:linear-gradient(135deg,#34d399,#059669);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .card{background:#111118;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:28px;max-width:500px;width:100%;text-align:center}
  button{padding:14px 32px;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}
  .btn-go{background:linear-gradient(135deg,#34d399,#059669);color:#fff;width:100%}
  .btn-go:hover{box-shadow:0 4px 24px rgba(52,211,153,.3)}
  .log{background:rgba(0,0,0,.3);border-radius:8px;padding:14px;margin-top:16px;max-height:220px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:#7a7a8a;text-align:left;display:none}
  .log.show{display:block}
  .log .ok{color:#34d399}
  .log .fail{color:#f43f5e}
  .info{font-size:.7rem;margin-top:10px}
  .count{color:#34d399;font-size:1.2rem;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>📥 一键导出缺失文件</h1>
  <p>自动检测 IndexedDB 中的文件，只下载缺失的</p>
  <button class="btn-go" id="btnGo" onclick="doExport()">🚀 开始自动检测并下载缺失文件</button>
  <div class="log" id="log"></div>
  <div class="info" id="info"></div>
</div>

<script>
const DB='PF_DB',S='media';
function odb(){return new Promise((ok,fail)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(S)};r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)})}
async function dbGet(k){const db=await odb();return new Promise(ok=>{const t=db.transaction(S,'readonly');const r=t.objectStore(S).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}

const logEl=document.getElementById('log'),infoEl=document.getElementById('info'),btnGo=document.getElementById('btnGo');
function log(msg,cls){logEl.classList.add('show');logEl.innerHTML+='<span class="'+cls+'">'+msg+'</span>\n';logEl.scrollTop=logEl.scrollHeight}

async function doExport(){
  btnGo.disabled=true;btnGo.textContent='检测中...';logEl.innerHTML='';
  const raw=localStorage.getItem('pf_data2');if(!raw){alert('没有数据');return}
  const data=JSON.parse(raw);

  // Collect all media keys
  const allKeys=[];
  (data.photos||[]).forEach(x=>{(x.imgs&&x.imgs.length?x.imgs:[x.id]).forEach(k=>allKeys.push(k))});
  (data.videos||[]).forEach(x=>{allKeys.push(x.id);if(x.thumbKey)allKeys.push(x.thumbKey)});

  log('数据中共 '+allKeys.length+' 个媒体引用','ok');

  // Check which ones have blobs in IndexedDB
  let inDB=0,missing=0;
  const toDownload=[];
  for(const k of allKeys){
    const blob=await dbGet(k);
    if(blob){inDB++;toDownload.push({key:k,blob})}
    else{missing++}
  }
  log('IndexedDB中有 '+inDB+' 个文件，缺失 '+missing+' 个引用','ok');
  if(toDownload.length===0){infoEl.innerHTML='没有可下载的文件';btnGo.disabled=false;btnGo.textContent='🚀 开始';return}

  // Download each
  let ok=0,fail=0;
  for(let i=0;i<toDownload.length;i++){
    const {key:k,blob}=toDownload[i];
    try{
      const ext=blob.type.split('/')[1]||'bin';
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=k+'.'+ext;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      ok++;log('✅ '+(i+1)+'/'+toDownload.length+' '+k+'.'+ext,'ok')
    }catch(e){fail++;log('❌ '+k,'fail')}
    await new Promise(r=>setTimeout(r,200));
  }

  log('--- 完成: ✅'+ok+' ❌'+fail+' 共 '+toDownload.length+' ---','ok');
  infoEl.innerHTML='全部下载到 Documents 文件夹后，运行项目中的 sync_media.bat 自动同步并推送';
  btnGo.disabled=false;btnGo.textContent='🔄 重新下载';
}
</script>
</body>
</html>
